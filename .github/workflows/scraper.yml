name: Atualizar Odds Betano

on:
  schedule:
    - cron: '0 12 * * 4,6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências, Chrome e Display Virtual
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils
        pip install selenium seleniumbase PrettyColorPrinter a-selenium2df pandas numpy
        seleniumbase install chromedriver

    - name: Executar o Scraper da Betano com Tela Virtual
      run: xvfb-run --server-args="-screen 0 1024x768x24" python code_update.py

    - name: Salvar CSV no Repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add proximos_jogos_betano.csv
        git commit -m "Auto-update: proximos_jogos_betano.csv" || exit 0
        git push
