name: Atualizador Semanal do Motor Quant

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: 

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas matemáticas e de evasão
        run: |
          python -m pip install --upgrade pip
          pip install pandas cloudscraper lxml html5lib

      - name: Rodar o script de extração (ETL)
        run: python update_dataset.py

      - name: Comitar e empurrar as alterações para o GitHub
        run: |
          git config --global user.name "QuantEngine Bot"
          git config --global user.email "bot@quantengine.local"
          git add campeonato-brasileiro-full.csv
          git commit -m "🤖 [Auto] Base de dados atualizada com os últimos resultados" || exit 0
          git push
