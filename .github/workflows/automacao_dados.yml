name: Atualizador Semanal do Motor Quant

# Define quando o robô vai acordar e rodar
on:
  schedule:
    # Roda toda segunda-feira às 08:00 UTC (05:00 no Brasil)
    - cron: '0 8 * * 1'
  
  # Permite que você clique em um botão no GitHub para rodar manualmente se quiser
  workflow_dispatch: 

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    
    # Permissão necessária para o robô fazer o commit no seu repositório
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas matemáticas e de scraping
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib

      - name: Rodar o script de extração (ETL)
        run: python update_dataset.py

      - name: Comitar e empurrar as alterações para o GitHub
        run: |
          git config --global user.name "QuantEngine Bot"
          git config --global user.email "bot@quantengine.local"
          
          # Adiciona o CSV atualizado
          git add campeonato-brasileiro-full.csv
          
          # Tenta comitar. Se não houver jogos novos (nada mudou), ele ignora e não dá erro
          git commit -m "🤖 [Auto] Base de dados atualizada com os últimos resultados da rodada" || exit 0
          
          # Empurra de volta para o repositório
          git push
