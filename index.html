<!DOCTYPE html>
<html lang=\"pt-BR\">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Quantitativo v3 | Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050811; color: #f1f5f9; }
        .glass-panel { background: rgba(10, 17, 32, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .score-grid td { width: 48px; height: 48px; text-align: center; border: 1px solid #131f37; font-size: 0.75rem; font-family: monospace; }
        .value-bet { background-color: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    PRO ANALYTICS <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-mono">V3.0 ENGINE</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Análise preditiva probabilística via Dixon-Coles & Amostragem Bayesiana.</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 glass-panel p-4 rounded-xl">
            <div>
                <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">ID da Liga (API-Sports)</label>
                <input type="number" id="leagueId" value="71" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Temporada (Ano)</label>
                <input type="number" id="season" value="2026" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="md:col-span-2 flex items-end">
                <button onclick="loadTeams()" id="btnLoad" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider p-3 rounded-lg transition-all duration-200">
                    Sincronizar Times da Liga
                </button>
            </div>
        </div>

        <div id="panelMatch" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 glass-panel p-4 rounded-xl items-end">
            <div>
                <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Mandante (Home)</label>
                <select id="homeTeam" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></select>
            </div>
            <div>
                <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Visitante (Away)</label>
                <select id="awayTeam" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></select>
            </div>
            <button onclick="runAnalysis()" id="btnAnalyze" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider p-3 rounded-lg transition-all duration-200">
                Calcular Matriz Probabilística
            </button>
        </div>

        <div id="resultsDashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="space-y-4">
                <div class="glass-panel p-4 rounded-xl space-y-3">
                    <h3 class="text-xs font-black tracking-wider uppercase text-slate-400 border-b border-slate-800 pb-2">Gols Esperados Projetados (xG)</h3>
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="bg-slate-950 p-3 rounded-lg border border-slate-900">
                            <p class="text-[10px] uppercase font-bold text-slate-500">Mandante</p>
                            <p id="xgHome" class="text-xl font-mono font-black text-white mt-1">0.00</p>
                        </div>
                        <div class="bg-slate-950 p-3 rounded-lg border border-slate-900">
                            <p class="text-[10px] uppercase font-bold text-slate-500">Visitante</p>
                            <p id="xgAway" class="text-xl font-mono font-black text-white mt-1">0.00</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-xl space-y-2">
                    <h3 class="text-xs font-black tracking-wider uppercase text-slate-400 border-b border-slate-800 pb-2">Probabilidades de Mercado (1X2)</h3>
                    <div class="space-y-2 font-mono text-xs mt-2" id="probContainer1X2"></div>
                </div>

                <div class="glass-panel p-4 rounded-xl space-y-2">
                    <h3 class="text-xs font-black tracking-wider uppercase text-slate-400 border-b border-slate-800 pb-2">Mercados Alternativos</h3>
                    <div class="space-y-2 font-mono text-xs mt-2" id="probContainerGoals"></div>
                </div>
            </div>

            <div class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center overflow-x-auto">
                <h3 class="text-xs font-black tracking-wider uppercase text-slate-400 border-b border-slate-800 pb-2 w-full text-left mb-4">Matriz Probabilística de Placares Extensiva</h3>
                <table class="score-grid border-collapse text-slate-300">
                    <thead>
                        <tr id="matrixHeader"></tr>
                    </thead>
                    <tbody id="matrixBody"></tbody>
                </table>
            </div>

            <div class="glass-panel p-4 rounded-xl space-y-4">
                <h3 class="text-xs font-black tracking-wider uppercase text-slate-400 border-b border-slate-800 pb-2">Linhas de Odds Reais da Casa</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">Odd 1</label>
                        <input type="number" step="0.01" id="oddHome" value="2.10" class="w-full bg-slate-950 border border-slate-850 p-2 rounded text-xs font-mono text-center text-white">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">Odd X</label>
                        <input type="number" step="0.01" id="oddDraw" value="3.40" class="w-full bg-slate-950 border border-slate-850 p-2 rounded text-xs font-mono text-center text-white">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">Odd 2</label>
                        <input type="number" step="0.01" id="oddAway" value="3.60" class="w-full bg-slate-950 border border-slate-850 p-2 rounded text-xs font-mono text-center text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">Odd Over 2.5</label>
                        <input type="number" step="0.01" id="oddOver" value="1.95" class="w-full bg-slate-950 border border-slate-850 p-2 rounded text-xs font-mono text-center text-white">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">Odd BTTS Sim</label>
                        <input type="number" step="0.01" id="oddBtts" value="1.80" class="w-full bg-slate-950 border border-slate-850 p-2 rounded text-xs font-mono text-center text-white">
                    </div>
                </div>
                <button onclick="calculateValueBets()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider p-2.5 rounded-lg transition-all">
                    Processar Filtro de Valor (EV)
                </button>
                <div id="reportContainer" class="mt-2"></div>
            </div>
        </div>
    </div>

    <script>
        // Substitua pelo endpoint real fornecido pelo Supabase após realizar o deploy da function
        const SUPABASE_FUNCTION_URL = "https://SEU_PROJECT_ID.supabase.co/functions/v1/predict-match";
        let lastCalculationData = null;

        async function callBackend(payload) {
            const response = await fetch(SUPABASE_FUNCTION_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Falha crítica na comunicação com o backend.");
            }
            return await response.json();
        }

        async function loadTeams() {
            const btn = document.getElementById("btnLoad");
            const lId = document.getElementById("leagueId").value;
            const season = document.getElementById("season").value;
            btn.disabled = true; btn.innerText = "Sincronizando Banco de Dados...";
            
            try {
                const teams = await callBackend({ action: "get_teams", leagueId: lId, season: season });
                const homeSel = document.getElementById("homeTeam");
                const awaySel = document.getElementById("awayTeam");
                homeSel.innerHTML = ""; awaySel.innerHTML = "";
                
                teams.sort((a,b) => a.team.name.localeCompare(b.team.name)).forEach(item => {
                    const opt = `<option value="${item.team.id}">${item.team.name}</option>`;
                    homeSel.insertAdjacentHTML("beforeend", opt);
                    awaySel.insertAdjacentHTML("beforeend", opt);
                });
                document.getElementById("panelMatch").classList.remove("hidden");
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Sincronizar Times da Liga";
            }
        }

        async function runAnalysis() {
            const btn = document.getElementById("btnAnalyze");
            const payload = {
                action: "predict",
                leagueId: document.getElementById("leagueId").value,
                season: document.getElementById("season").value,
                homeId: document.getElementById("homeTeam").value,
                awayId: document.getElementById("awayTeam").value
            };
            if(payload.homeId === payload.awayId) return alert("Erro: Conflito Operacional. O Mandante não pode ser idêntico ao Visitante.");
            
            btn.disabled = true; btn.innerText = "Rodando Algoritmos Quânticos...";
            try {
                const data = await callBackend(payload);
                lastCalculationData = data;
                document.getElementById("resultsDashboard").classList.remove("hidden");
                
                document.getElementById("xgHome").innerText = data.lambda.toFixed(2);
                document.getElementById("xgAway").innerText = data.mu.toFixed(2);
                
                renderMarkets(data.probabilities);
                renderMatrix(data.matrix);
                document.getElementById("reportContainer").innerHTML = ""; 
            } catch(err) {
                alert(err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Calcular Matriz Probabilística";
            }
        }

        function renderMarkets(probs) {
            const container1X2 = document.getElementById("probContainer1X2");
            container1X2.innerHTML = `
                <div class="flex justify-between"><span>Mandante (1):</span><span class="font-bold text-white">${(probs.home * 100).toFixed(1)}%</span></div>
                <div class="flex justify-between"><span>Empate (X):</span><span class="font-bold text-white">${(probs.draw * 100).toFixed(1)}%</span></div>
                <div class="flex justify-between"><span>Visitante (2):</span><span class="font-bold text-white">${(probs.away * 100).toFixed(1)}%</span></div>
            `;
            const containerGoals = document.getElementById("probContainerGoals");
            containerGoals.innerHTML = `
                <div class="flex justify-between"><span>Over 2.5 Gols:</span><span class="font-bold text-emerald-400">${(probs.over25 * 100).toFixed(1)}%</span></div>
                <div class="flex justify-between"><span>Ambas Marcam (BTTS):</span><span class="font-bold text-cyan-400">${(probs.btts * 100).toFixed(1)}%</span></div>
            `;
        }

        function renderMatrix(matrix) {
            const header = document.getElementById("matrixHeader");
            const body = document.getElementById("matrixBody");
            header.innerHTML = "<th>V \\ M</th>";
            for(let i=0; i<6; i++) header.insertAdjacentHTML("beforeend", `<th class="p-1 font-mono text-[10px] text-slate-500">${i}</th>`);
            
            body.innerHTML = "";
            for(let y=0; y<6; y++) {
                let rowHtml = `<tr><td class="font-mono text-[10px] text-slate-500 font-bold bg-slate-950/40">${y}</td>`;
                for(let x=0; x<6; x++) {
                    const prob = (matrix[x][y] * 100).toFixed(1);
                    rowHtml += `<td class="p-1 text-[10px] tracking-tighter" style="background: rgba(16, 185, 129, ${matrix[x][y] * 3.5})">${prob}%</td>`;
                }
                rowHtml += "</tr>";
                body.insertAdjacentHTML("beforeend", rowHtml);
            }
        }

        function calculateValueBets() {
            if(!lastCalculationData) return;
            const odds = {
                home: parseFloat(document.getElementById("oddHome").value),
                draw: parseFloat(document.getElementById("oddDraw").value),
                away: parseFloat(document.getElementById("oddAway").value),
                over25: parseFloat(document.getElementById("oddOver").value),
                btts: parseFloat(document.getElementById("oddBtts").value)
            };
            const probs = lastCalculationData.probabilities;
            const markets = [
                { name: "Mandante (1)", odd: odds.home, prob: probs.home },
                { name: "Empate (X)", odd: odds.draw, prob: probs.draw },
                { name: "Visitante (2)", odd: odds.away, prob: probs.away },
                { name: "Over 2.5 Gols", odd: odds.over25, prob: probs.over25 },
                { name: "Ambas Marcam (BTTS)", odd: odds.btts, prob: probs.btts }
            ];

            let bestBet = null, maxEv = 0;
            markets.forEach(m => {
                const ev = (m.prob * m.odd) - 1;
                if(ev > maxEv) { maxEv = ev; bestBet = m; }
            });

            const report = document.getElementById("reportContainer");
            if(bestBet && maxEv > 0.02) { // Gatilho conservador de EV > +2%
                // Mitigação de Risco: Kelly Fracionado Seguro de 1/4 (Quarter-Kelly) com teto rígido de 5% da banca
                const rawKelly = (bestBet.odd * bestBet.prob - (1 - bestBet.prob)) / (bestBet.odd - 1);
                const safeKelly = Math.min((rawKelly * 0.25) * 100, 5.0).toFixed(2);

                report.innerHTML = `
                    <div class="p-4 bg-emerald-950/20 border-l-4 border-emerald-500 rounded-xl text-xs space-y-2">
                        <p class="font-black text-emerald-400 uppercase tracking-wider">ENTRADA DETECTADA DE ALTO VALOR</p>
                        <p class="text-white font-bold">${bestBet.name} @ ${bestBet.odd.toFixed(2)}</p>
                        <ul class="list-disc ml-4 space-y-1 text-slate-400 text-[11px]">
                            <li>Valor Esperado Puro (EV): <span class="text-emerald-400 font-bold">+${(maxEv * 100).toFixed(1)}%</span></li>
                            <li>Preço Justo Estatístico: <span class="text-white">${(1/bestBet.prob).toFixed(2)}</span></li>
                            <li>Gestão de Banca (Quarter-Kelly): Alocar estritamente <span class="text-emerald-300 font-bold">${safeKelly}%</span>.</li>
                        </ul>
                    </div>`;
            } else {
                report.innerHTML = `
                    <div class="p-4 bg-slate-900/40 border-l-4 border-amber-500 rounded-xl text-xs space-y-1">
                        <p class="font-black text-amber-500 uppercase tracking-wider text-[11px]">SINAL DE NEUTRALIDADE (NO BET)</p>
                        <p class="text-slate-400 text-[11px]">O mercado encontra-se eficiente ou a margem da casa (Juice) anulou as arestas de valor. Aguardar Live.</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
