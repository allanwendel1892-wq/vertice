<script>

/* =========================================
   CONFIG
========================================= */

const CACHE_TTL = 1000 * 60 * 60 * 6;
const API_BASE = 'https://v3.football.api-sports.io';

/* =========================================
   INIT
========================================= */

document.addEventListener('DOMContentLoaded', () => {

    const savedKey = localStorage.getItem('quant_api_key_v5');

    if(savedKey){
        document.getElementById('apiKey').value = savedKey;
    }

});

/* =========================================
   HELPERS
========================================= */

function safeNumber(value, fallback = 0){

    const n = parseFloat(value);

    return isNaN(n) ? fallback : n;

}

function factorial(n){

    if(n <= 1){
        return 1;
    }

    let result = 1;

    for(let i = 2; i <= n; i++){
        result *= i;
    }

    return result;

}

function poisson(k, lambda){

    return (
        Math.pow(lambda, k) *
        Math.exp(-lambda)
    ) / factorial(k);

}

function dixonColes(x, y, lambda, mu, rho = -0.07){

    if(x === 0 && y === 0){
        return 1 - (lambda * mu * rho);
    }

    if(x === 0 && y === 1){
        return 1 + (lambda * rho);
    }

    if(x === 1 && y === 0){
        return 1 + (mu * rho);
    }

    if(x === 1 && y === 1){
        return 1 - rho;
    }

    return 1;

}

function calculateEV(probability, odd){

    return (probability * odd) - 1;

}

function calculateKelly(probability, odd){

    const b = odd - 1;
    const q = 1 - probability;

    const kelly = ((b * probability) - q) / b;

    return Math.max(0, kelly);

}

function normalizeProbabilities(arr){

    const total = arr.reduce((acc, val) => acc + val, 0);

    return arr.map(v => v / total);

}

/* =========================================
   CACHE SYSTEM
========================================= */

function setCache(key, data){

    const payload = {
        timestamp: Date.now(),
        data
    };

    sessionStorage.setItem(
        key,
        JSON.stringify(payload)
    );

}

function getCache(key){

    try{

        const raw = sessionStorage.getItem(key);

        if(!raw){
            return null;
        }

        const parsed = JSON.parse(raw);

        const expired =
            Date.now() - parsed.timestamp > CACHE_TTL;

        if(expired){

            sessionStorage.removeItem(key);

            return null;

        }

        return parsed.data;

    }catch{

        return null;

    }

}

/* =========================================
   API LAYER
========================================= */

async function fetchAPI(endpoint){

    const key =
        document.getElementById('apiKey')
        .value
        .trim();

    if(!key){

        throw new Error(
            'API Key obrigatória.'
        );

    }

    localStorage.setItem(
        'quant_api_key_v5',
        key
    );

    const response = await fetch(
        `${API_BASE}/${endpoint}`,
        {
            method:'GET',
            headers:{
                'x-apisports-key': key
            }
        }
    );

    if(response.status === 429){

        throw new Error(
            'Limite diário da API atingido.'
        );

    }

    if(!response.ok){

        throw new Error(
            `Erro HTTP ${response.status}`
        );

    }

    const data = await response.json();

    if(
        data.errors &&
        Object.keys(data.errors).length > 0
    ){

        const message =
            JSON.stringify(data.errors);

        throw new Error(message);

    }

    return data;

}

/* =========================================
   LOAD TEAMS
========================================= */

async function loadTeams(){

    const button =
        document.getElementById('btnLoad');

    const leagueId =
        document.getElementById('leagueId').value;

    const season =
        document.getElementById('season').value;

    button.disabled = true;
    button.innerText = 'CARREGANDO...';

    try{

        const cacheKey =
            `teams_${leagueId}_${season}`;

        let teams = getCache(cacheKey);

        if(!teams){

            const result =
                await fetchAPI(
                    `teams?league=${leagueId}&season=${season}`
                );

            teams = result.response.map(item => ({
                id:item.team.id,
                name:item.team.name
            }));

            setCache(cacheKey, teams);

        }

        teams.sort((a,b)=>
            a.name.localeCompare(b.name)
        );

        const home =
            document.getElementById('homeTeam');

        const away =
            document.getElementById('awayTeam');

        home.innerHTML = '';
        away.innerHTML = '';

        teams.forEach(team => {

            const html = `
                <option value="${team.id}">
                    ${team.name}
                </option>
            `;

            home.insertAdjacentHTML(
                'beforeend',
                html
            );

            away.insertAdjacentHTML(
                'beforeend',
                html
            );

        });

        if(away.options.length > 1){
            away.selectedIndex = 1;
        }

        document
            .getElementById('matchPanel')
            .classList
            .remove('hidden');

        button.innerText =
            '✔ DADOS CARREGADOS';

        button.classList.replace(
            'bg-blue-600',
            'bg-slate-700'
        );

    }catch(error){

        alert(error.message);

        button.innerText =
            'CARREGAR DADOS';

    }finally{

        button.disabled = false;

    }

}

/* =========================================
   TEAM STATS
========================================= */

async function getTeamStatistics(
    leagueId,
    season,
    teamId
){

    const cacheKey =
        `stats_${leagueId}_${season}_${teamId}`;

    let stats = getCache(cacheKey);

    if(stats){
        return stats;
    }

    const response = await fetchAPI(
        `teams/statistics?league=${leagueId}&season=${season}&team=${teamId}`
    );

    stats = response.response;

    setCache(cacheKey, stats);

    return stats;

}

/* =========================================
   LEAGUE FIXTURES
========================================= */

async function getLeagueFixtures(
    leagueId,
    season
){

    const cacheKey =
        `fixtures_${leagueId}_${season}`;

    let fixtures = getCache(cacheKey);

    if(fixtures){

        return {
            data:fixtures,
            fromCache:true
        };

    }

    const response = await fetchAPI(
        `fixtures?league=${leagueId}&season=${season}&status=FT`
    );

    fixtures = response.response || [];

    setCache(cacheKey, fixtures);

    return {
        data:fixtures,
        fromCache:false
    };

}

/* =========================================
   H2H FIXED
========================================= */

/*
FREE PLAN NÃO SUPORTA:
&last=6

ERRO:
"Free plans do not have access to the Last parameter."

SOLUÇÃO:
remover last=6
e limitar manualmente.
*/

async function getH2H(homeId, awayId){

    const ids = [homeId, awayId]
        .sort()
        .join('_');

    const cacheKey = `h2h_${ids}`;

    let data = getCache(cacheKey);

    if(data){
        return data;
    }

    const response = await fetchAPI(
        `fixtures/headtohead?h2h=${homeId}-${awayId}`
    );

    data = (response.response || [])
        .slice(0, 6);

    setCache(cacheKey, data);

    return data;

}

/* =========================================
   MAIN ANALYSIS
========================================= */

async function runAnalysis(){

    const loading =
        document.getElementById('loading');

    const dashboard =
        document.getElementById('dashboard');

    const loadingText =
        document.getElementById('loadingText');

    const button =
        document.getElementById('btnAnalyze');

    const leagueId =
        document.getElementById('leagueId').value;

    const season =
        document.getElementById('season').value;

    const homeSelect =
        document.getElementById('homeTeam');

    const awaySelect =
        document.getElementById('awayTeam');

    const homeId = homeSelect.value;
    const awayId = awaySelect.value;

    if(homeId === awayId){

        return alert(
            'Mandante e visitante devem ser diferentes.'
        );

    }

    button.disabled = true;

    dashboard.classList.add('hidden');

    loading.classList.remove('hidden');

    try{

        loadingText.innerText =
            'Coletando estatísticas...';

        const [
            homeStats,
            awayStats,
            fixturesResult,
            h2h
        ] = await Promise.all([

            getTeamStatistics(
                leagueId,
                season,
                homeId
            ),

            getTeamStatistics(
                leagueId,
                season,
                awayId
            ),

            getLeagueFixtures(
                leagueId,
                season
            ),

            getH2H(
                homeId,
                awayId
            )

        ]);

        processEngine({

            homeId,
            awayId,

            inputs:{

                homeName:
                    homeSelect.options[
                        homeSelect.selectedIndex
                    ].text,

                awayName:
                    awaySelect.options[
                        awaySelect.selectedIndex
                    ].text,

                odds:{

                    home:safeNumber(
                        document.getElementById('oddHome').value,
                        2
                    ),

                    draw:safeNumber(
                        document.getElementById('oddDraw').value,
                        3.3
                    ),

                    away:safeNumber(
                        document.getElementById('oddAway').value,
                        3.5
                    ),

                    over25:safeNumber(
                        document.getElementById('oddOver').value,
                        1.9
                    ),

                    btts:safeNumber(
                        document.getElementById('oddBTTS').value,
                        1.8
                    )

                }

            },

            homeStats,
            awayStats,

            fixtures:
                fixturesResult.data,

            fixturesFromCache:
                fixturesResult.fromCache,

            h2h

        });

        loading.classList.add('hidden');

        dashboard.classList.remove('hidden');

        dashboard.scrollIntoView({
            behavior:'smooth'
        });

    }catch(error){

        alert(error.message);

        loading.classList.add('hidden');

    }finally{

        button.disabled = false;

    }

}

/* =========================================
   PROCESS ENGINE
========================================= */

function processEngine(data){

    const {
        homeId,
        awayId,
        inputs,
        homeStats,
        awayStats,
        fixtures,
        fixturesFromCache,
        h2h
    } = data;

    /* =========================
       TEAM STRENGTH
    ========================= */

    const homeScored =
        safeNumber(
            homeStats?.goals?.for?.average?.home,
            1.45
        );

    const homeConceded =
        safeNumber(
            homeStats?.goals?.against?.average?.home,
            1.10
        );

    const awayScored =
        safeNumber(
            awayStats?.goals?.for?.average?.away,
            1.15
        );

    const awayConceded =
        safeNumber(
            awayStats?.goals?.against?.average?.away,
            1.30
        );

    /* =========================
       LEAGUE AVERAGES
    ========================= */

    let leagueHomeAvg = 1.45;
    let leagueAwayAvg = 1.15;

    if(fixtures.length > 10){

        let totalHome = 0;
        let totalAway = 0;
        let count = 0;

        fixtures.forEach(match => {

            const h = match?.goals?.home;
            const a = match?.goals?.away;

            if(h !== null && a !== null){

                totalHome += h;
                totalAway += a;

                count++;

            }

        });

        if(count > 0){

            leagueHomeAvg =
                totalHome / count;

            leagueAwayAvg =
                totalAway / count;

        }

    }

    /* =========================
       ATTACK / DEFENSE
    ========================= */

    const attackHome =
        homeScored / leagueHomeAvg;

    const defenseHome =
        homeConceded / leagueAwayAvg;

    const attackAway =
        awayScored / leagueAwayAvg;

    const defenseAway =
        awayConceded / leagueHomeAvg;

    let lambda =
        attackHome *
        defenseAway *
        leagueHomeAvg;

    let mu =
        attackAway *
        defenseHome *
        leagueAwayAvg;

    /* =========================
       BAYESIAN SHRINKAGE
    ========================= */

    const shrink = 0.18;

    lambda =
        (lambda * (1 - shrink)) +
        (leagueHomeAvg * shrink);

    mu =
        (mu * (1 - shrink)) +
        (leagueAwayAvg * shrink);

    /* =========================
       H2H RECENCY
    ========================= */

    if(h2h.length > 0){

        let weightedHome = 0;
        let weightedAway = 0;
        let totalWeight = 0;

        h2h.forEach((match,index)=>{

            const weight =
                Math.exp(-index * 0.45);

            const isHome =
                match.teams.home.id == homeId;

            const hGoals =
                isHome
                ? match.goals.home
                : match.goals.away;

            const aGoals =
                isHome
                ? match.goals.away
                : match.goals.home;

            weightedHome += hGoals * weight;
            weightedAway += aGoals * weight;

            totalWeight += weight;

        });

        const h2hHome =
            weightedHome / totalWeight;

        const h2hAway =
            weightedAway / totalWeight;

        lambda =
            (lambda * 0.95) +
            (h2hHome * 0.05);

        mu =
            (mu * 0.95) +
            (h2hAway * 0.05);

    }

    lambda = Math.max(0.25, lambda);
    mu = Math.max(0.25, mu);

    /* =========================
       UI
    ========================= */

    document.getElementById('homeNameRes')
        .innerText = inputs.homeName;

    document.getElementById('awayNameRes')
        .innerText = inputs.awayName;

    document.getElementById('homeXg')
        .innerText = lambda.toFixed(2);

    document.getElementById('awayXg')
        .innerText = mu.toFixed(2);

    document.getElementById('homeBar')
        .style.width =
        `${Math.min(lambda * 25,100)}%`;

    document.getElementById('awayBar')
        .style.width =
        `${Math.min(mu * 25,100)}%`;

    /* =========================
       MATRIX
    ========================= */

    const matrixLimit = 10;
    const visualLimit = 5;

    let matrix = [];

    let probHome = 0;
    let probDraw = 0;
    let probAway = 0;

    let probUnder25 = 0;
    let probBTTS = 0;

    for(let x=0;x<=matrixLimit;x++){

        matrix[x] = [];

        for(let y=0;y<=matrixLimit;y++){

            const prob =
                poisson(x, lambda) *
                poisson(y, mu) *
                dixonColes(x,y,lambda,mu);

            matrix[x][y] = prob;

            if(x > y){
                probHome += prob;
            }else if(x === y){
                probDraw += prob;
            }else{
                probAway += prob;
            }

            if((x + y) < 3){
                probUnder25 += prob;
            }

            if(x > 0 && y > 0){
                probBTTS += prob;
            }

        }

    }

    [probHome, probDraw, probAway] =
        normalizeProbabilities([
            probHome,
            probDraw,
            probAway
        ]);

    const probOver25 =
        1 - probUnder25;

    renderMatrix(matrix, visualLimit);

    renderMarkets({

        inputs,

        probHome,
        probDraw,
        probAway,

        probOver25,
        probBTTS

    });

    document.getElementById('statsBox').innerHTML = `
        <p>🏟 Média Liga Casa:
        <strong>${leagueHomeAvg.toFixed(2)}</strong></p>

        <p>✈ Média Liga Fora:
        <strong>${leagueAwayAvg.toFixed(2)}</strong></p>

        <p>📚 H2H:
        <strong>${h2h.length}</strong></p>

        <p>🧠 Shrinkage:
        <strong>18%</strong></p>

        <p>⚡ Fonte:
        <strong class="${
            fixturesFromCache
            ? 'text-emerald-400'
            : 'text-amber-400'
        }">
            ${
                fixturesFromCache
                ? 'CACHE'
                : 'API'
            }
        </strong></p>
    `;

}

/* =========================================
   MATRIX RENDER
========================================= */

function renderMatrix(matrix, visualLimit){

    const head =
        document.getElementById('matrixHead');

    const body =
        document.getElementById('matrixBody');

    head.innerHTML =
        '<th class="p-2 text-slate-500">C \\ F</th>';

    for(let i=0;i<=visualLimit;i++){

        head.insertAdjacentHTML(
            'beforeend',
            `<th>${i}</th>`
        );

    }

    body.innerHTML = '';

    for(let x=0;x<=visualLimit;x++){

        let row =
            `<tr>
                <th class="bg-slate-900 text-blue-400 p-2">
                    ${x}
                </th>`;

        for(let y=0;y<=visualLimit;y++){

            const prob =
                matrix[x][y] * 100;

            let style =
                'bg-slate-950 text-slate-400';

            if(x > y){

                style =
                    'bg-blue-950/20 text-blue-400';

            }else if(x < y){

                style =
                    'bg-purple-950/20 text-purple-400';

            }else{

                style =
                    'bg-slate-900/70 text-white font-bold';

            }

            row += `
                <td class="${style}">
                    ${prob.toFixed(1)}%
                </td>
            `;

        }

        row += '</tr>';

        body.insertAdjacentHTML(
            'beforeend',
            row
        );

    }

}

/* =========================================
   MARKET RENDER
========================================= */

function renderMarkets(data){

    const {
        inputs,
        probHome,
        probDraw,
        probAway,
        probOver25,
        probBTTS
    } = data;

    const markets = [

        {
            name:`Vitória ${inputs.homeName}`,
            probability:probHome,
            odd:inputs.odds.home
        },

        {
            name:'Empate',
            probability:probDraw,
            odd:inputs.odds.draw
        },

        {
            name:`Vitória ${inputs.awayName}`,
            probability:probAway,
            odd:inputs.odds.away
        }

    ];

    const goals = [

        {
            name:'Over 2.5',
            probability:probOver25,
            odd:inputs.odds.over25
        },

        {
            name:'BTTS Sim',
            probability:probBTTS,
            odd:inputs.odds.btts
        }

    ];

    document.getElementById('marketCards')
        .innerHTML =
        markets.map(renderCard).join('');

    document.getElementById('goalCards')
        .innerHTML =
        goals.map(renderCard).join('');

}

/* =========================================
   CARD
========================================= */

function renderCard(market){

    const ev =
        calculateEV(
            market.probability,
            market.odd
        );

    const fairOdd =
        1 / market.probability;

    const valueBet =
        ev > 0.02;

    const rawKelly =
        calculateKelly(
            market.probability,
            market.odd
        );

    const quarterKelly =
        Math.min(
            rawKelly * 0.25 * 100,
            5
        );

    return `
        <div class="
            p-4
            rounded-2xl
            flex
            flex-col
            justify-between
            ${
                valueBet
                ? 'value-bet'
                : 'no-bet'
            }
        ">

            <div>

                <h3 class="font-bold text-white text-sm mb-2">
                    ${market.name}
                </h3>

                <div class="space-y-1 text-xs font-mono text-slate-400">

                    <p>
                        Prob:
                        <span class="text-white">
                            ${(market.probability * 100).toFixed(1)}%
                        </span>
                    </p>

                    <p>
                        Odd Justa:
                        <span class="text-blue-300">
                            ${fairOdd.toFixed(2)}
                        </span>
                    </p>

                    <p>
                        Mercado:
                        <span class="text-emerald-400 font-bold">
                            ${market.odd.toFixed(2)}
                        </span>
                    </p>

                </div>

            </div>

            <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">

                <span class="
                    font-black
                    text-lg
                    ${
                        valueBet
                        ? 'text-emerald-400'
                        : 'text-red-400/70'
                    }
                ">
                    EV ${(ev * 100).toFixed(1)}%
                </span>

                ${
                    valueBet
                    ? `
                        <span class="text-[10px] bg-emerald-500/15 border border-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full font-mono">
                            Stake ${quarterKelly.toFixed(2)}%
                        </span>
                    `
                    : `
                        <span class="text-[10px] text-slate-500">
                            NO BET
                        </span>
                    `
                }

            </div>

        </div>
    `;

}

</script>
